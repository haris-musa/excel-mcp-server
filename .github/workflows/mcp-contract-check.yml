name: MCP Contract Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-validation:
    name: Validate MCP Tool Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run MCP Contract & Schema Fuzz Check
        uses: gendjo-owlhead/mcp-contract-check@76147a9ebab5a72bffa0e2d36499bc6694475b05 # v1
        with:
          command: "uv run excel-mcp-server stdio"
          fuzz: "true"
