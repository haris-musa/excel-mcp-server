name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The tool call or prompt, and a small workbook if one is needed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uvx excel-mcp-server --version`.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and transport
      placeholder: Claude Desktop, stdio
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
